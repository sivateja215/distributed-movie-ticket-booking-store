syntax = "proto3";

package movie;

option go_package = "moviekv/api/movie";

service MovieTicketService {
  rpc GetSeat(GetSeatRequest) returns (GetSeatResponse);
  rpc BookSeat(BookSeatRequest) returns (BookSeatResponse);
}

service NodeService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc StartElection(StartElectionRequest) returns (StartElectionResponse);
  rpc ReplicateLogEntry(ReplicateLogEntryRequest) returns (ReplicateLogEntryResponse);
}

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message GetSeatRequest {
  string show_id = 1;
  string seat_id = 2;
}

message GetSeatResponse {
  string show_id = 1;
  string seat_id = 2;
  string status = 3;
}

message BookSeatRequest {
  string show_id = 1;
  string seat_id = 2;
  string user_id = 3;
  string request_id = 4;
}

message BookSeatResponse {
  string booking_id = 1;
  string show_id = 2;
  string seat_id = 3;
  string status = 4;
  string message = 5;
}

message PingRequest {
  string node_id = 1;
}

message PingResponse {
  string node_id = 1;
  string status = 2;
}

message StartElectionRequest {
  string node_id = 1;
}

message StartElectionResponse {
  string node_id = 1;
  int32 term = 2;
  string role = 3;
}

message ReplicateLogEntryRequest {
  string command = 1;
  string key = 2;
  string value = 3;
  string request_id = 4;
}

message ReplicateLogEntryResponse {
  int32 index = 1;
  int32 term = 2;
  string status = 3;
  string message = 4;
}

message RequestVoteRequest {
  int32 term = 1;
  string candidate_id = 2;
  int32 last_log_index = 3;
  int32 last_log_term = 4;
}

message RequestVoteResponse {
  int32 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  int32 term = 1;
  string command = 2;
  string key = 3;
  string value = 4;
  string request_id = 5;
}

message AppendEntriesRequest {
  int32 term = 1;
  string leader_id = 2;
  int32 prev_log_index = 3;
  int32 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int32 leader_commit = 6;
}

message AppendEntriesResponse {
  int32 term = 1;
  bool success = 2;
}