apiVersion: v1
kind: Service
metadata:
  name: node1
spec:
  selector:
    app: movie-store
    node-id: node1
  ports:
  - port: 50051
    targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: node2
spec:
  selector:
    app: movie-store
    node-id: node2
  ports:
  - port: 50052
    targetPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: node3
spec:
  selector:
    app: movie-store
    node-id: node3
  ports:
  - port: 50053
    targetPort: 50053
---
apiVersion: v1
kind: Pod
metadata:
  name: node1
  labels:
    app: movie-store
    node-id: node1
spec:
  containers:
  - name: movie-server
    image: movie-store:latest
    imagePullPolicy: Never
    command: ["./movie-server"]
    args: ["-id", "node1", "-port", "50051"]
    env:
    - name: RAFT_PEERS
      value: "node1=node1:50051,node2=node2:50052,node3=node3:50053"
    ports:
    - containerPort: 50051
---
apiVersion: v1
kind: Pod
metadata:
  name: node2
  labels:
    app: movie-store
    node-id: node2
spec:
  containers:
  - name: movie-server
    image: movie-store:latest
    imagePullPolicy: Never
    command: ["./movie-server"]
    args: ["-id", "node2", "-port", "50052"]
    env:
    - name: RAFT_PEERS
      value: "node1=node1:50051,node2=node2:50052,node3=node3:50053"
    ports:
    - containerPort: 50052
---
apiVersion: v1
kind: Pod
metadata:
  name: node3
  labels:
    app: movie-store
    node-id: node3
spec:
  containers:
  - name: movie-server
    image: movie-store:latest
    imagePullPolicy: Never
    command: ["./movie-server"]
    args: ["-id", "node3", "-port", "50053"]
    env:
    - name: RAFT_PEERS
      value: "node1=node1:50051,node2=node2:50052,node3=node3:50053"
    ports:
    - containerPort: 50053
