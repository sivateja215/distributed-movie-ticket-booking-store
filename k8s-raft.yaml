apiVersion: v1
kind: Service
metadata:
  name: movie-store
spec:
  clusterIP: None
  selector:
    app: movie-store
  ports:
  - name: raft
    port: 50051
    targetPort: 50051
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: movie-store
spec:
  serviceName: movie-store
  replicas: 3
  selector:
    matchLabels:
      app: movie-store
  template:
    metadata:
      labels:
        app: movie-store
    spec:
      containers:
      - name: movie-server
        image: movie-store:latest
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        - |
          ordinal="${HOSTNAME##*-}"

          case "$ordinal" in
            0)
              exec ./movie-server -id node1 -port 50051
              ;;
            1)
              exec ./movie-server -id node2 -port 50052
              ;;
            2)
              exec ./movie-server -id node3 -port 50053
              ;;
            *)
              echo "Unknown StatefulSet ordinal: $ordinal"
              exit 1
              ;;
          esac
        env:
        - name: RAFT_PEERS
          value: "node1=movie-store-0.movie-store:50051,node2=movie-store-1.movie-store:50052,node3=movie-store-2.movie-store:50053"
        ports:
        - name: raft
          containerPort: 50051
        - name: raft-node2
          containerPort: 50052
        - name: raft-node3
          containerPort: 50053
        volumeMounts:
        - name: raft-data
          mountPath: /app/data
  volumeClaimTemplates:
  - metadata:
      name: raft-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
